<div *ngIf="!this.affiche1 && this.id==null" class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form  [formGroup]="loginform" cForm>
                <h1>Se connecter </h1>
                <p class="text-body-secondary">Sign In to your account</p>
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input  formControlName="email" autoComplete="username" cFormControl placeholder="Username" />
                </c-input-group>
                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input formControlName="password" 
                    autoComplete="current-password"
                    cFormControl
                    placeholder="Password"
                    type="password"
                  />
                </c-input-group>
                <c-row>
                  <c-col xs="6">
                    <button cButton class="px-4" color="primary" (click)="connexion()">
                      Se connecter 
                    </button>
                  </c-col>
                  
                </c-row>
                <p> Vous avez oublier Mot de passe ? <a (click)="affiche()">Cliquez ICI</a></p>

              </form>
            </c-card-body>
          </c-card>
          <c-card [ngStyle]="{'minWidth.%': 44}" class="text-white bg-primary py-5">
            <c-card-body class="text-center">
              <div>
                <h2>S'inscrire</h2>
                
                <button [active]="true" cButton class="mt-3" color="primary" routerLink="/register">
                  S'inscrire maintenant !
                </button>
              </div>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
<div *ngIf="this.affiche1 && this.id==null" class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form  [formGroup]="loginform" cForm>
                <h1>Rénitialiser Mot de passe </h1>
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input  formControlName="email2" autoComplete="username" cFormControl placeholder="Username" />
                </c-input-group>
             <c-row>
                  <c-col xs="6">
                    <button cButton class="px-4" color="primary" (click)="envoyer()">
                      Envoyer
                    </button>
                  </c-col>
                  
                </c-row>

              </form>
            </c-card-body>
          </c-card>
       
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
