<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Interface avec Bootstrap</title>
    <!-- Lien vers la feuille de style Bootstrap 5 -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css">
    <!-- Lien vers les icônes Bootstrap -->
    <link rel="stylesheet" href="https://icons.getbootstrap.com/">
</head>
    <!-- Votre propre feuille de style CSS (si nécessaire) -->
<body>
    <div class="login-box">


        <form [formGroup]="form">
            <div class="textbox">
                <i class="fas fa-user menu-icon"></i>
                <input formControlName="password1" type="password" placeholder="Mot de Passe" name="username" required>
            </div>
            <div class="textbox">
                <i class="fas fa-lock"></i>

                <input formControlName="password2"  type="password" placeholder="Mot de passe" name="password" required>
            </div>
            <button  (click)="enregistrer()" 
            type="submit" class="btn" value="Sign in">Enregistrer</button>

            
        </form>
    </div>
   
</body>
