<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API List</title>
<style>/* Dropdown Button */
  .dropbtn {
    background-color: #4CAF50;
    color: white;
    padding: 16px;
    font-size: 16px;
    border: none;
    cursor: pointer;
  }
  
  /* Dropdown button on hover & focus */
  .dropbtn:hover, .dropbtn:focus {
    background-color: #3e8e41;
  }
  
  /* The container <div> - needed to position the dropdown content */
  .dropdown {
    position: relative;
    display: inline-block;
  }
  
  /* Dropdown Content (Hidden by Default) */
  .dropdown-content {
    display: none;
    position: absolute;
    background-color: #f9f9f9;
    min-width: 160px;
    box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
    z-index: 1;
  }
  
  /* Links inside the dropdown */
  .dropdown-content button {
    color: black;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
  }
  
  /* Change color of dropdown links on hover */
  .dropdown-content button:hover {background-color: #f1f1f1;}
  
  /* Show the dropdown menu on hover */
  .dropdown:hover .dropdown-content {display: block;}
  
  /* Change the background color of the dropdown button when the dropdown content is shown */
  .dropdown:hover .dropbtn {background-color: #3e8e41;}
  
  /* Table styles */
  .api-table {
    margin-top: 20px;
  }
  
  table {
    border-collapse: collapse;
    width: 100%;
  }
  
  th, td {
    border: 1px solid #dddddd;
    text-align: left;
    padding: 8px;
  }
  
  th {
    background-color: #f2f2f2;
  }
  </style></head>
<body>
  
  <div id="apiTable" class="api-table">
    <table>
      <thead>
        <tr>
          <th>Adresse</th>
          <th>CNI</th>
          <th>Domaine</th>
          <th>Nom</th>
          <th>Publier</th>
          <th>Pays</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <!-- Table body for API1 -->
        <tr>
          <td>{{this.hebergeur?.adresse}}</td>
          <td>{{this.hebergeur?.cni}}</td>
          <td>{{this.hebergeur?.domaine}}</td>
          <td>{{this.hebergeur?.nom}}</td>
          <td *ngIf="this.hebergeur.publier=='1'" >Oui</td>
          <td *ngIf="this.hebergeur.publier=='0'" >Non</td>
          <td *ngIf="this.hebergeur.pays==''" >Tunisie</td>
          <td *ngIf="this.hebergeur.pays!=null" >{{this.hebergeur?.pays}}</td>
          

        </tr>
      
      </tbody>
    </table>
  </div>

  <script src="script.js">function toggleTable() {
    var table = document.getElementById("apiTable");
    if (table.style.display === "none") {
      table.style.display = "block";
    } else {
      table.style.display = "none";
    }
  }
  
  function showTable() {
    var api1Table = document.getElementById("api1Table");
    api1Table.style.display = "table-row";
  }
  </script>
</body>
</html>
