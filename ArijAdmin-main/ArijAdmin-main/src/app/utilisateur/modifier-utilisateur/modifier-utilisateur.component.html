<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ajouter Utilisateur</title>
<style>
  /* Style du bouton */
  .btn {
    padding: 10px 20px;
    background-color: #0f9f0c;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 25px;
    margin-top: 10px;
  }

  /* Style du formulaire */
  .form-container {
    display: none;
    margin-top: 20px;
  }

  .form-field {
    margin-bottom: 10px;
  }

  .form-field label {
    display: block;
    margin-bottom: 5px;
  }

  .form-field input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  /* Style du bouton de soumission */
  .submit-btn {
    padding: 10px 20px;
    background-color: #2ecc71;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
  }
  .submit{
    padding: 10px 20px;
    background-color: #c5b5b5;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
  }
</style>
</head>
<body>


<div >
  <form [formGroup]="structureform" id="userForm">
    <div class="form-field">
      <label for="name">Nom:</label>
      <input type="text" [ngModel]="this.user?.nom" formControlName="nom" id="name" name="name" required>
    </div>
    <div class="form-field">
        <label for="name">Preom:</label>
        <input type="text" [ngModel]="this.user?.prenom" formControlName="prenom" id="name" name="name" required>
      </div>
    
    <div class="form-field">
      <label for="email">Email:</label>
      <input type="email" [ngModel]="this.user?.email" formControlName="email" id="email" name="email" required>
    </div>
    
    
    <button type="submit" class="submit">Cancel</button>

    <button type="submit" (click)="enregistrer()" class="submit-btn">Enregistrer</button>
  </form>
</div>



</body>
</html>
