
  
  
  
      
      <div class="title">Liste des APIs</div>
      
      <br><br>
      <table>
        <tr>
          <th>Nom API</th>
          <th>Description</th>
          <th>Input & Output</th>
          <th>Cadre d'utilisation</th>
          <th>Mode</th>
          <th>Détail Hebergeur</th>
          <th>lancez vos demandes</th>
          <th *ngIf="this.profil=='Data Owner'">Action</th>
        </tr>
        
        <tr *ngFor="let a of api " >
          <td>{{a?.nom}}</td>
          <td>{{a?.description}}</td>
          <td>{{a?.input}} {{a.output}}</td>
          <td>{{a?.cadreutilisation}}</td>
          <td>{{a?.mode}}</td>
          <td><button type="button" class="btn btn-info"  [routerLink]="['../hebergeur',  { id: a?.hebergeur.id }]" > Détail Hébéergeur          </button></td>
          <td>      <button type="button" class="btn btn-warning" [routerLink]="['../demande']" >lancez vos demandes</button>
          </td>
          <td *ngIf="this.profil=='Data Owner'">
            <span class="action-icons">✏️</span>
            <span class="action-icons">🗑️</span>
          </td>
        </tr>
  
      </table>
