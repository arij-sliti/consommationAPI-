

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>liste demandes</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  
</head>
<body>

<b><h1 class="display-4 text-center my-4 text-primary custom-title">Résultat Demande:</h1></b>
 <form [formGroup]="urlForm">
<div class="container mt-5">
    <table class="table">
      <thead class="thead-dark">
        <tr>
          <th scope="col">Réference demande : </th>
           <th scope="col">Date de création de demande :</th>

          <th scope="col">Nom Api</th>
          <th scope="col">Nom Utilisateur</th>
          <th scope="col">URL</th>

        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let d of demandee" >
            <td>{{d?.reference}}</td>
            <td>{{d?.date}}</td>
            <td>{{d?.api?.nom}}</td>
            <td>{{d?.utilisateur?.nom}}</td>
            <td *ngIf="d.url==null">taper URL : <input formControlName="url" type="text"></td>
            <td *ngIf="d.url!=null"><a>{{d?.url}}</a></td>
            <td *ngIf="d.url==null"><button type="button" class="btn btn-dark" (click)="url(d.id)">Envoyer URL</button></td>

        </tr>
       
      

      </tbody>
    </table>
  </div>
</form>

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
